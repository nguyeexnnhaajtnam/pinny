services:
  api:
    container_name: pinny-api
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      PINNY_DATABASE_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn pinny.main:app --host 0.0.0.0 --port 8000"]

  postgres:
    container_name: pinny-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinny}
      POSTGRES_USER: ${POSTGRES_USER:-pinny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinny}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
